<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Scenario Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#0b1120;color:#e2e8f0}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
button,select,input{font:inherit;font-size:14px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:7px 12px}
button{cursor:pointer}
button:hover{border-color:#64748b}
button:disabled,input:disabled{opacity:.4;cursor:default}
input[type=color]{padding:2px;width:40px;height:34px}
label{display:flex;align-items:center;gap:6px;font-size:13px}
.lang button{padding:4px 10px;font-size:12px}
.back{color:#e2e8f0;text-decoration:none;font-size:12px;padding:4px 10px;border:1px solid #334155;border-radius:8px;background:#1e293b}
.lang button.on{background:#2563eb;border-color:#2563eb}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:8px 6px}
.tool small{font-size:10px;opacity:.6;margin-top:2px}
.tool.on{background:#2563eb;border-color:#2563eb}
.status{padding:10px 14px;border-radius:8px;background:#1e3a8a;font-size:14px;min-height:42px;display:flex;align-items:center;margin-top:8px}
canvas{width:100%;display:block;touch-action:none;border-radius:10px;margin-top:8px}
.timeline{position:relative;min-height:96px;background:#111827;border-radius:10px;margin-top:8px;overflow:hidden;cursor:pointer;user-select:none;touch-action:none}
.tick{position:absolute;top:4px;font-size:10px;color:#64748b;transform:translateX(-50%);pointer-events:none}
.kf{position:absolute;top:24px;width:12px;height:12px;background:#facc15;transform:translateX(-50%) rotate(45deg);cursor:pointer}
.evbar{position:absolute;top:46px;height:30px;border-radius:6px;font-size:11px;line-height:30px;padding:0 6px;white-space:nowrap;overflow:hidden;color:#0b1120;font-weight:600;cursor:pointer;min-width:14px}
.evbar.sel{outline:2px solid #fff;outline-offset:1px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;pointer-events:none}
.panel{background:#111827;border-radius:10px;padding:10px 14px;margin-top:8px}
.panel-title{font-size:14px;font-weight:600;margin-bottom:8px}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.controls input[type=range]{width:160px}
.val{font-variant-numeric:tabular-nums;min-width:44px;font-size:13px;color:#94a3b8}
details{margin-top:12px;font-size:13px;color:#94a3b8}
details li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <div class="row lang" style="margin:0">
      <a href="../" class="back" data-i18n="back"></a>
      <button data-lang="en" class="on">EN</button><button data-lang="vi">VI</button>
    </div>
  </header>

  <div class="row">
    <select id="mode">
      <option value="5" data-i18n="mode5"></option>
      <option value="7" selected data-i18n="mode7"></option>
      <option value="11" data-i18n="mode11"></option>
    </select>
    <label><span data-i18n="colA"></span> <input type="color" id="colA" value="#1e6fd9"></label>
    <label><span data-i18n="colB"></span> <input type="color" id="colB" value="#e03c31"></label>
    <button id="reset" data-i18n="reset"></button>
    <button id="undo" data-i18n="undo" disabled></button>
    <button id="redo" data-i18n="redo" disabled></button>
    <button id="export" data-i18n="export"></button>
    <button id="import" data-i18n="import"></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <div class="tools" id="tools">
    <button class="tool on" data-tool="move"><span data-i18n="tool_move"></span><small>V</small></button>
    <button class="tool" data-tool="pass"><span data-i18n="tool_pass"></span><small>P</small></button>
    <button class="tool" data-tool="cross"><span data-i18n="tool_cross"></span><small>C</small></button>
    <button class="tool" data-tool="shot"><span data-i18n="tool_shot"></span><small>S</small></button>
    <button class="tool" data-tool="dribble"><span data-i18n="tool_dribble"></span><small>D</small></button>
    <button class="tool" data-tool="tackle"><span data-i18n="tool_tackle"></span><small>T</small></button>
    <button class="tool" data-tool="block"><span data-i18n="tool_block"></span><small>B</small></button>
    <button class="tool" data-tool="duel"><span data-i18n="tool_duel"></span><small>G</small></button>
    <button class="tool" data-tool="aerial"><span data-i18n="tool_aerial"></span><small>A</small></button>
    <button class="tool" data-tool="arrow"><span data-i18n="tool_arrow"></span><small>W</small></button>
    <button class="tool" data-tool="line"><span data-i18n="tool_line"></span><small>L</small></button>
    <button class="tool" data-tool="area"><span data-i18n="tool_area"></span><small>R</small></button>
    <button id="clearDraw" data-i18n="clearDraw"></button>
  </div>

  <div class="status" id="status"></div>
  <canvas id="pitch"></canvas>

  <div class="row">
    <button id="restart" data-i18n="restart"></button>
    <button id="play" data-i18n="play"></button>
    <label><span data-i18n="speed"></span>
      <select id="speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </label>
    <span id="time" class="val" style="min-width:90px"></span>
    <button id="kdel" data-i18n="keyDel"></button>
  </div>

  <div class="timeline" id="track">
    <div class="ph" id="ph"></div>
  </div>

  <div class="panel">
    <div class="panel-title" id="ptitle"></div>
    <div class="controls">
      <label><span data-i18n="dur"></span> <input type="range" id="pdur" min="0.2" max="3" step="0.1"> <span class="val" id="pdurv"></span></label>
      <label><span data-i18n="bend"></span> <input type="range" id="pbend" min="-1" max="1" step="0.1"> <span class="val" id="pbendv"></span></label>
      <label><span data-i18n="lift"></span> <input type="range" id="plift" min="0" max="1" step="0.1"> <span class="val" id="pliftv"></span></label>
      <button id="pdel" data-i18n="evDel"></button>
    </div>
  </div>

  <details>
    <summary data-i18n="guide_title"></summary>
    <ol>
      <li data-i18n="g1"></li>
      <li data-i18n="g2"></li>
      <li data-i18n="g3"></li>
      <li data-i18n="g4"></li>
      <li data-i18n="g5"></li>
    </ol>
  </details>
</div>

<script>
const cvs = document.getElementById('pitch');
const ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);

const PAD = 28;
const ASPECT = {5: 1.8, 7: 1.5, 11: 1.55};
const FORMATIONS = {
  5: [[.04,.5],[.2,.25],[.2,.75],[.33,.5],[.45,.5]],
  7: [[.04,.5],[.15,.25],[.15,.75],[.28,.35],[.28,.65],[.38,.3],[.38,.7]],
  11: [[.04,.5],[.16,.15],[.16,.38],[.16,.62],[.16,.85],[.32,.15],[.3,.38],[.3,.62],[.32,.85],[.44,.38],[.44,.62]]
};
const TYPE_DEFAULTS = {
  pass: {dur: .8, bend: 0, lift: 0},
  cross: {dur: 1.2, bend: 0, lift: .6},
  shot: {dur: .7, bend: 0, lift: .1},
  dribble: {dur: 1, bend: 0, lift: 0},
  tackle: {dur: .4, bend: 0, lift: 0},
  block: {dur: .4, bend: 0, lift: 0},
  duel: {dur: .6, bend: 0, lift: 0},
  aerial: {dur: .8, bend: 0, lift: .8}
};
const TYPE_COLOR = {pass:'#22c55e',cross:'#06b6d4',shot:'#f97316',dribble:'#a855f7',tackle:'#eab308',block:'#e5e7eb',duel:'#f43f5e',aerial:'#3b82f6'};
const FLIGHT = new Set(['pass', 'cross', 'shot']);
const BALL_EV = new Set(['pass', 'cross', 'shot', 'dribble', 'tackle', 'block', 'aerial']);
const CONTACT = new Set(['tackle', 'duel', 'aerial', 'block']);
const KEYS = {v:'move',p:'pass',c:'cross',s:'shot',d:'dribble',t:'tackle',b:'block',g:'duel',a:'aerial',w:'arrow',l:'line',r:'area'};
const SHAPES = new Set(['arrow', 'line']); // two-point drag tools; 'area' is a click-built polygon

const I18N = {

    st_arrow: 'Mũi tên: kéo trên sân để vẽ. Vẽ được cả khi đang tạm dừng.', st_line: 'Đường kẻ: kéo trên sân để vẽ.', st_area: 'Vùng: nhấn để đặt các điểm; nhấn lại điểm đầu (hoặc nhấn đúp) để khép kín.',
    st_move: 'Kéo cầu thủ hoặc bóng để đặt vị trí. Khung hình được tạo tự động tại thời điểm hiện tại.',

    st_shot: 'Sút: nhấn cầu thủ sút, rồi nhấn một khoảng trống; nhấn lại cầu thủ để sút vào khung thành.',
    st_dribble: 'Rê bóng: nhấn cầu thủ đang rê.',
    st_tackle: 'Tắc bóng: nhấn cầu thủ tắc, rồi nhấn cầu thủ bị tắc.',
    st_block: 'Chặn: nhấn cầu thủ chặn bóng.',
    st_duel: 'Tranh chấp mặt đất: nhấn hai cầu thủ.',
    st_aerial: 'Tranh chấp trên không: nhấn hai cầu thủ. Bóng bổng giữa hai người.',

    st_needPlayer: 'Hãy nhấn vào một cầu thủ.',
    st_added: 'Đã thêm sự kiện. Chọn công cụ khác hoặc nhấn Di chuyển để thoát.',
    st_locked: 'Không thể kéo bóng khi sự kiện bóng đang diễn ra.',
    st_deleted: 'Đã xóa sự kiện.',
    st_noKey: 'Không có khung hình tại thời điểm này.',
    st_keyDeleted: 'Đã xóa khung hình.',
    panel_none: 'Chọn một sự kiện trên thanh thời gian để chỉnh sửa. Hoặc chọn công cụ để đặt thông số mặc định.',

    dur: 'Thời lượng', bend: 'Độ cong', lift: 'Độ bổng',

    play: '▶ Phát', pause: '❚❚ Tạm dừng', restart: '⟲ Phát lại', speed: 'Tốc độ',
    pass: 'Chuyền', cross: 'Tạt', shot: 'Sút', dribble: 'Rê', tackle: 'Tắc', block: 'Chặn',
    duel: 'Tranh chấp', aerial: 'Trên không', goal: 'Khung thành', space: 'Khoảng trống', ball: 'Bóng',
    guide_title: 'Hướng dẫn nhanh',

    g2: 'Nhấn hoặc kéo thanh thời gian để đổi thời điểm. Nhấn Phát để xem lại toàn bộ.',

    g4: 'Nhấn thanh sự kiện trên thanh thời gian để chỉnh thời lượng, độ cong và độ bổng.',

  },
  en: {
    title: 'Football Scenario Simulator',
    back: '← Home', confirmLose: 'This will discard the current scenario. Continue?',
    mode5: '5-a-side', mode7: '7-a-side', mode11: '11-a-side',
    colA: 'Team A', colB: 'Team B', reset: 'Reset formation', undo: 'Undo', redo: 'Redo', export: 'Export', import: 'Import',
    st_imported: 'Scenario imported.', st_importFail: 'Import failed: invalid file.',
    tool_move: 'Move', tool_pass: 'Pass', tool_cross: 'Cross', tool_shot: 'Shot',
    tool_dribble: 'Dribble', tool_tackle: 'Tackle', tool_block: 'Block', tool_duel: 'Duel', tool_aerial: 'Aerial', tool_arrow: 'Arrow', tool_line: 'Line', tool_area: 'Area', clearDraw: 'Clear drawings',
    st_arrow: 'Arrow: drag on the pitch to draw. Works while paused too.', st_line: 'Line: drag on the pitch to draw.', st_area: 'Area: click to place points; click the first point (or double-click) to close the shape.',
    st_move: 'Drag players or the ball to position them. Keyframes are created automatically at the current time.',
    st_pass: 'Pass: click the passer, then the receiver or an empty spot.',
    st_cross: 'Cross: click the crosser, then the receiver or an empty spot.',
    st_shot: 'Shot: click the shooter, then an empty spot; click the shooter again to shoot at goal.',
    st_dribble: 'Dribble: click the player dribbling.',
    st_tackle: 'Tackle: click the tackler, then the player tackled.',
    st_block: 'Block: click the blocking player.',
    st_duel: 'Ground duel: click both players.',
    st_aerial: 'Aerial duel: click both players. The ball rises between them.',
    st_pickTarget: 'Click a player or an empty spot as the target. Click the actor again to cancel (Shot: to shoot at goal).',
    st_needPlayer: 'Click a player.',
    st_added: 'Event added. Pick another tool, or choose Move to exit.',
    st_locked: 'The ball cannot be dragged while a ball event is active.',
    st_deleted: 'Event deleted.',
    st_noKey: 'No keyframe at this time.',
    st_keyDeleted: 'Keyframe deleted.',
    panel_none: 'Select an event on the timeline to edit it, or pick a tool to set its defaults.',
    panel_defaults: 'Defaults for',
    dur: 'Duration', bend: 'Curve', lift: 'Height',
    keyDel: 'Delete keyframe here', evDel: 'Delete event',
    play: '▶ Play', pause: '❚❚ Pause', restart: '⟲ Restart', speed: 'Speed',
    pass: 'Pass', cross: 'Cross', shot: 'Shot', dribble: 'Dribble', tackle: 'Tackle', block: 'Block',
    duel: 'Duel', aerial: 'Aerial', goal: 'Goal', space: 'Space', ball: 'Ball',
    guide_title: 'Quick guide',
    g1: 'Drag players or the ball to position them. Each drag creates a keyframe at the current time.',
    g2: 'Click or drag the timeline to change time. Press Play to watch the whole sequence.',
    g3: 'Pick a tool (or press V, P, C, S, D, T, B, G, A), then click players to create an event.',
    g4: 'Click an event bar on the timeline to adjust duration, curve and height.',
    g5: 'Space: play / pause · Delete: remove selected event · Esc: cancel and return to Move.'
  }
};

let lang = 'en', mode = '7', tokens = [], kfs = [], events = [], shapes = [], evSeq = 0, drawing = null, poly = null;
let tool = 'move', pendingActor = null, selEvent = null, mpos = null, drag = null, scrubbing = false;
let statusKey = 'st_move', lastL = 0, W = 0, H = 0, R = 12;
const defaults = JSON.parse(JSON.stringify(TYPE_DEFAULTS));
const state = {playing: false, t: 0, speed: 1, last: 0};

const T = k => (I18N[lang][k] ?? k);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const kfEnd = () => (kfs.length ? kfs[kfs.length - 1].t : 0);
const dur = () => Math.max(kfEnd(), ...events.map(e => e.t + e.dur), 0);
const timelineLen = () => Math.max(10, Math.ceil(dur() + 2));
const active = (e, t) => t >= e.t - 1e-9 && t <= e.t + e.dur + 1e-9;
const frac = (e, t) => clamp((t - e.t) / e.dur, 0, 1);
const toPx = p => ({x: PAD + p.x * (W - 2 * PAD), y: PAD + p.y * (H - 2 * PAD)});
const displayPx = tk => {
  const q = toPx(tk);
  return {x: q.x, y: q.y - (tk.z || 0) * H * 0.2};
};
const colorOf = tk => tk.type === 'b' ? '#ffffff' : (tk.team === 0 ? $('colA').value : $('colB').value);
const tokName = id => {
  const tk = tokens[id];
  if (!tk) return '';
  return tk.type === 'b' ? T('ball') : `${tk.team === 0 ? 'A' : 'B'}${tk.num}`;
};
const goalPt = id => ({x: tokens[id].team === 0 ? 1 : 0, y: .5});
// Flight target: 'goal', a free {x,y} point, or a player id.
const tgtPos = (e, t) => e.target === 'goal' ? goalPt(e.actor) : typeof e.target === 'object' ? e.target : interp(t)[e.target];
const tgtLabel = e => e.target === 'goal' ? T('goal') : typeof e.target === 'object' ? T('space') : tokName(e.target);
const ballInActive = () => events.some(e => BALL_EV.has(e.type) && active(e, state.t));

function setStatus(key) {
  statusKey = key;
  $('status').textContent = T(key);
}

function applyI18n() {
  document.documentElement.lang = lang;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  setStatus(statusKey);
  setPlayLabel();
  renderTimeline();
  updateEventPanel();
}

function initial() {
  const pts = [];
  FORMATIONS[mode].forEach(p => pts.push({x: p[0], y: p[1]}));
  FORMATIONS[mode].forEach(p => pts.push({x: 1 - p[0], y: p[1]}));
  pts.push({x: .5, y: .5});
  return pts;
}

function build() {
  const n = FORMATIONS[mode].length;
  const pts = initial();
  tokens = pts.map((p, i) => {
    const isBall = i === pts.length - 1;
    return {
      id: i,
      type: isBall ? 'b' : 'p',
      team: isBall ? -1 : (i < n ? 0 : 1),
      num: isBall ? 0 : (i < n ? i + 1 : i - n + 1),
      x: p.x, y: p.y, z: 0
    };
  });
  kfs = [{t: 0, p: pts}];
  events = [];
  shapes = [];
  selEvent = null;
  pendingActor = null;
  state.playing = false;
  applyTime(0);
  renderTimeline();
  updateEventPanel();
  setPlayLabel();
}

const KEY = 'football-replay:scenario';
let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 300);
  pushHistory();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(serialize())); } catch {} }

// Undo/redo: undoStack top = current state.
const undoStack = [], redoStack = [];
let restoring = false;
function pushHistory() {
  if (restoring) return;
  const s = JSON.stringify(serialize());
  if (s === undoStack[undoStack.length - 1]) return;
  undoStack.push(s);
  if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}
function updateHistoryButtons() {
  $('undo').disabled = undoStack.length < 2;
  $('redo').disabled = !redoStack.length;
}
function stepHistory(from, to) {
  if (from.length < (from === undoStack ? 2 : 1)) return;
  const cur = undoStack[undoStack.length - 1];
  const snap = from === undoStack ? undoStack[undoStack.length - 2] : from[from.length - 1];
  restoring = true;
  try { restore(JSON.parse(snap)); } catch { restoring = false; return; }
  restoring = false;
  if (from === undoStack) { redoStack.push(undoStack.pop()); } else { undoStack.push(redoStack.pop()); }
  clearTimeout(saveTimer);
  save();
  updateHistoryButtons();
}
const undo = () => stepHistory(undoStack, redoStack);
const redo = () => stepHistory(redoStack, undoStack);

// Scenario JSON (v1): {v, mode, colA, colB, kfs:[{t,p:[{x,y}]}], events:[{...event, endKf:index|null}], evSeq}
function serialize() {
  return {
    v: 1, mode, colA: $('colA').value, colB: $('colB').value, evSeq,
    kfs: kfs.map(k => ({t: k.t, p: k.p.map(q => ({x: q.x, y: q.y}))})),
    events: events.map(e => ({...e, endKf: kfs.indexOf(e.endKf)})),
    shapes: JSON.parse(JSON.stringify(shapes))
  };
}

// Throws on invalid input; leaves current state untouched in that case.
function restore(d) {
  const n = FORMATIONS[d && d.mode] ? FORMATIONS[d.mode].length * 2 + 1 : 0;
  const num = v => typeof v === 'number' && isFinite(v);
  const color = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
  if (!d || d.v !== 1 || !n || !color(d.colA) || !color(d.colB) || !num(d.evSeq)) throw new Error('bad scenario');
  if (!Array.isArray(d.kfs) || !d.kfs.length || !Array.isArray(d.events)) throw new Error('bad scenario');
  const k2 = d.kfs.map(k => {
    if (!num(k.t) || !Array.isArray(k.p) || k.p.length !== n || !k.p.every(q => num(q.x) && num(q.y))) throw new Error('bad keyframe');
    return {t: k.t, p: k.p.map(q => ({x: q.x, y: q.y}))};
  });
  const e2 = d.events.map(e => {
    const ok = TYPE_DEFAULTS[e.type] && num(e.t) && num(e.dur) && e.dur > 0 && num(e.bend) && num(e.lift) && num(e.id) &&
      Number.isInteger(e.actor) && e.actor >= 0 && e.actor < n &&
      (e.target === null || e.target === 'goal' || (typeof e.target === 'object' && num(e.target.x) && num(e.target.y)) || (Number.isInteger(e.target) && e.target >= 0 && e.target < n)) &&
      (e.endKf === -1 || k2[e.endKf]);
    if (!ok) throw new Error('bad event');
    return {...e, endKf: e.endKf === -1 ? null : k2[e.endKf]};
  });
  const pt = q => q && num(q.x) && num(q.y);
  const sh = d.shapes === undefined ? [] : d.shapes;
  const shapeOk = h => h && (h.type === 'area' ? Array.isArray(h.pts) && h.pts.length >= 3 && h.pts.every(pt) : SHAPES.has(h.type) && pt(h.a) && pt(h.b));
  if (!Array.isArray(sh) || !sh.every(shapeOk)) throw new Error('bad shape');
  mode = d.mode;
  $('mode').value = mode;
  $('colA').value = d.colA;
  $('colB').value = d.colB;
  resize();
  build();
  kfs = k2;
  events = e2;
  shapes = sh.map(h => h.type === 'area' ? {type: 'area', pts: h.pts.map(q => ({x: q.x, y: q.y}))} : {type: h.type, a: {x: h.a.x, y: h.a.y}, b: {x: h.b.x, y: h.b.y}});
  evSeq = d.evSeq;
  applyTime(0);
  renderTimeline();
  updateEventPanel();
}

function interp(t) {
  const k = kfs;
  if (t <= k[0].t) return k[0].p;
  for (let j = 1; j < k.length; j++) {
    if (t <= k[j].t) {
      const a = k[j - 1], b = k[j];
      const f = (t - a.t) / ((b.t - a.t) || 1);
      return a.p.map((q, i) => ({
        x: q.x + (b.p[i].x - q.x) * f,
        y: q.y + (b.p[i].y - q.y) * f
      }));
    }
  }
  return k[k.length - 1].p;
}

function ensureKey(t) {
  let k = kfs.find(x => Math.abs(x.t - t) < 1e-6);
  if (!k) {
    k = {t, p: interp(t).map(q => ({x: q.x, y: q.y}))};
    kfs.push(k);
    kfs.sort((a, b) => a.t - b.t);
  }
  return k;
}

function arc(A, B, bend, lift, f) {
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const cx = (A.x + B.x) / 2 + nx * bend * len * 0.35;
  const cy = (A.y + B.y) / 2 + ny * bend * len * 0.35;
  const u = 1 - f;
  return {
    x: u * u * A.x + 2 * u * f * cx + f * f * B.x,
    y: u * u * A.y + 2 * u * f * cy + f * f * B.y,
    z: lift * 4 * f * u
  };
}

function motionDir(e) {
  const A = interp(e.t)[e.actor], B = interp(e.t + e.dur)[e.actor];
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
  if (len < 1e-6) return {x: tokens[e.actor].team === 0 ? 1 : -1, y: 0};
  return {x: dx / len, y: dy / len};
}

function ballOfEvent(e, t, P) {
  const endT = e.t + e.dur, ct = Math.min(t, endT), f = frac(e, ct);
  if (FLIGHT.has(e.type)) {
    const A = interp(e.t)[e.actor];
    const B = tgtPos(e, endT);
    return arc(A, B, e.bend, e.lift, f);
  }
  const Pc = (ct === t && P) ? P : interp(ct);
  if (e.type === 'aerial') {
    const A = Pc[e.actor], B = Pc[e.target];
    return {x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, z: e.lift * 4 * f * (1 - f)};
  }
  const A = Pc[e.actor], d = motionDir(e);
  return {x: A.x + d.x * 0.022, y: A.y + d.y * 0.022, z: 0};
}

function ballAt(t, P) {
  for (let i = events.length - 1; i >= 0; i--) {
    const e = events[i];
    if (BALL_EV.has(e.type) && active(e, t)) return ballOfEvent(e, t, P);
  }
  return P[tokens.length - 1];
}

function zOf(id, t) {
  let z = 0;
  for (const e of events) {
    if (e.type !== 'aerial' || !active(e, t)) continue;
    if (e.actor === id || e.target === id) {
      const f = frac(e, t);
      z = Math.max(z, 0.4 * 4 * f * (1 - f));
    }
  }
  return z;
}

function applyTime(t) {
  state.t = t;
  const P = interp(t), bi = tokens.length - 1;
  tokens.forEach((tk, i) => {
    if (i === bi) return;
    tk.x = P[i].x; tk.y = P[i].y; tk.z = zOf(i, t);
  });
  const b = ballAt(t, P);
  tokens[bi].x = b.x; tokens[bi].y = b.y; tokens[bi].z = b.z || 0;
}

function syncEvent(e) {
  const endT = e.t + e.dur;
  ensureKey(e.t);
  let k = (e.endKf && kfs.includes(e.endKf)) ? e.endKf : null;
  if (k && Math.abs(k.t - endT) > 1e-6) {
    if (kfs.some(x => x !== k && Math.abs(x.t - endT) < 1e-6)) k = null;
    else { k.t = endT; kfs.sort((a, b) => a.t - b.t); }
  }
  if (!k) k = ensureKey(endT);
  const B = ballOfEvent(e, endT);
  k.p[tokens.length - 1] = {x: B.x, y: B.y};
  e.endKf = k;
}

function createEvent(type, actor, target) {
  pause();
  const d = defaults[type];
  const e = {
    id: ++evSeq, type, t: state.t, dur: d.dur, bend: d.bend, lift: d.lift,
    actor,
    target: type === 'shot' ? (target || 'goal') : (type === 'dribble' || type === 'block') ? null : target,
    endKf: null
  };
  events.push(e);
  events.sort((a, b) => a.t - b.t);
  syncEvent(e);
  selEvent = e;
  pendingActor = null;
  applyTime(state.t);
  renderTimeline();
  updateEventPanel();
  setStatus('st_added');
  scheduleSave();
}

function deleteEvent() {
  if (!selEvent) return;
  events = events.filter(x => x !== selEvent);
  selEvent = null;
  applyTime(state.t);
  renderTimeline();
  updateEventPanel();
  setStatus('st_deleted');
  scheduleSave();
}

function deleteKeyHere() {
  const i = kfs.findIndex(k => Math.abs(k.t - state.t) < 1e-6 && k.t > 0);
  if (i < 0) return setStatus('st_noKey');
  kfs.splice(i, 1);
  applyTime(state.t);
  renderTimeline();
  setStatus('st_keyDeleted');
  scheduleSave();
}

function setTool(name) {
  tool = name;
  pendingActor = null;
  poly = null;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === name));
  cvs.style.cursor = name === 'move' ? 'default' : 'crosshair';
  setStatus('st_' + name);
  updateEventPanel();
}

function setPlayLabel() {
  $('play').textContent = state.playing ? T('pause') : T('play');
}

function pause() {
  state.playing = false;
  setPlayLabel();
}

function play() {
  if (dur() <= 0) return;
  if (state.t >= dur()) applyTime(0);
  state.playing = true;
  state.last = performance.now();
  setPlayLabel();
}

function seek(t) {
  pause();
  applyTime(clamp(t, 0, timelineLen()));
}

function selectEvent(e) {
  selEvent = e;
  if (e) seek(e.t);
  renderTimeline();
  updateEventPanel();
}

function updateEventPanel() {
  const e = selEvent;
  const d = e ? e : (tool !== 'move' ? defaults[tool] : null);
  let title = T('panel_none');
  if (e) {
    const tgt = e.target == null ? '' : ' → ' + tgtLabel(e);
    title = `${T(e.type)} · ${tokName(e.actor)}${tgt}`;
  } else if (d) {
    title = `${T('panel_defaults')} ${T(tool)}`;
  }
  $('ptitle').textContent = title;
  const vals = d || {dur: .8, bend: 0, lift: 0};
  $('pdur').value = vals.dur;
  $('pbend').value = vals.bend;
  $('plift').value = vals.lift;
  $('pdurv').textContent = vals.dur.toFixed(1) + ' s';
  $('pbendv').textContent = vals.bend.toFixed(1);
  $('pliftv').textContent = vals.lift.toFixed(1);
  ['pdur', 'pbend', 'plift'].forEach(id => $(id).disabled = !d);
  $('pdel').disabled = !e;
}

function setParam(key, val) {
  const target = selEvent || (tool !== 'move' ? defaults[tool] : null);
  if (!target) return;
  target[key] = val;
  if (selEvent) {
    syncEvent(selEvent);
    applyTime(state.t);
    renderTimeline();
  }
  updateEventPanel();
  scheduleSave();
}

function renderTimeline() {
  const L = timelineLen();
  lastL = L;
  const tr = $('track');
  tr.querySelectorAll('.tick,.kf,.evbar').forEach(n => n.remove());
  for (let s = 0; s <= L; s++) {
    const d = document.createElement('div');
    d.className = 'tick';
    d.style.left = (s / L * 100) + '%';
    d.textContent = s + 's';
    tr.appendChild(d);
  }
  kfs.forEach(k => {
    const d = document.createElement('div');
    d.className = 'kf';
    d.style.left = (k.t / L * 100) + '%';
    d.title = k.t.toFixed(2) + ' s';
    d.addEventListener('pointerdown', ev => { ev.stopPropagation(); seek(k.t); });
    tr.appendChild(d);
  });
  const laneEnd = [];
  const laneOf = new Map();
  [...events].sort((a, b) => a.t - b.t).forEach(e => {
    let l = laneEnd.findIndex(end => end <= e.t + 1e-9);
    if (l < 0) { l = laneEnd.length; laneEnd.push(0); }
    laneEnd[l] = e.t + e.dur;
    laneOf.set(e, l);
  });
  tr.style.height = (56 + Math.max(1, laneEnd.length) * 34) + 'px';
  events.forEach(e => {
    const b = document.createElement('div');
    b.className = 'evbar' + (e === selEvent ? ' sel' : '');
    b.style.top = (46 + laneOf.get(e) * 34) + 'px';
    b.style.left = (e.t / L * 100) + '%';
    b.style.width = Math.max(e.dur / L * 100, 2) + '%';
    b.style.background = TYPE_COLOR[e.type];
    b.textContent = T(e.type);
    b.title = `${T(e.type)} · ${e.t.toFixed(2)} s`;
    b.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectEvent(e); });
    tr.appendChild(b);
  });
}

function scrubTo(e) {
  const r = $('track').getBoundingClientRect();
  const f = clamp((e.clientX - r.left) / r.width, 0, 1);
  applyTime(f * timelineLen());
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = cvs.clientWidth;
  H = W / ASPECT[mode];
  cvs.width = W * dpr;
  cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.max(10, W * 0.024);
  draw();
}

function drawField() {
  const x0 = PAD, y0 = PAD, w = W - 2 * PAD, h = H - 2 * PAD;
  ctx.fillStyle = '#166534';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 10; i += 2) {
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(x0 + i * w / 10, y0, w / 10, h);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x0, y0, w, h);
  ctx.beginPath(); ctx.moveTo(x0 + w / 2, y0); ctx.lineTo(x0 + w / 2, y0 + h); ctx.stroke();
  ctx.beginPath(); ctx.arc(x0 + w / 2, y0 + h / 2, h * 0.14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x0 + w / 2, y0 + h / 2, 3, 0, Math.PI * 2); ctx.fill();
  const bw = w * ({5: .12, 7: .14, 11: .16})[mode], bh = h * .56;
  ctx.strokeRect(x0, y0 + (h - bh) / 2, bw, bh);
  ctx.strokeRect(x0 + w - bw, y0 + (h - bh) / 2, bw, bh);
  const gw = h * .12;
  ctx.strokeRect(x0 - 6, y0 + (h - gw) / 2, 6, gw);
  ctx.strokeRect(x0 + w, y0 + (h - gw) / 2, 6, gw);
}

function drawTrajectory(e) {
  const A = interp(e.t)[e.actor];
  const B = tgtPos(e, e.t + e.dur);
  ctx.beginPath();
  for (let k = 0; k <= 40; k++) {
    const p = arc(A, B, e.bend, e.lift, k / 40);
    const q = displayPx({x: p.x, y: p.y, z: p.z});
    k ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
  }
  ctx.strokeStyle = e === selEvent ? 'rgba(251,191,36,.9)' : 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function ring(p, r, color, width = 2, dashed = false) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  if (dashed) ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawEffects(P) {
  const t = state.t;
  events.forEach(e => {
    if (!active(e, t) || !CONTACT.has(e.type)) return;
    const f = frac(e, t);
    const A = P[e.actor];
    const B = e.target != null ? P[e.target] : null;
    let c = A;
    if (B) {
      c = {x: (A.x + B.x) / 2, y: (A.y + B.y) / 2};
      const a = toPx(A), b = toPx(B);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(251,191,36,.7)'; ctx.lineWidth = 2; ctx.stroke();
    }
    ring(toPx(c), R * (1 + 2 * f), `rgba(251,191,36,${1 - f})`, 3);
  });
}

function drawBanner(e, row) {
  const tgt = e.target == null ? '' : ' → ' + tgtLabel(e);
  const txt = `${T(e.type)} · ${tokName(e.actor)}${tgt}`;
  ctx.font = '12px system-ui, sans-serif';
  const w = ctx.measureText(txt).width + 12;
  const y = 6 + row * 20;
  ctx.fillStyle = 'rgba(15,23,42,.85)';
  ctx.fillRect(PAD, y, w, 18);
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, PAD + 6, y + 9);
}

function drawPlayer(tk) {
  const z = tk.z || 0;
  if (z > 0) {
    const q = toPx(tk);
    ctx.beginPath();
    ctx.ellipse(q.x, q.y, R * 0.9, R * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fill();
  }
  const p = displayPx(tk);
  ctx.beginPath();
  ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
  ctx.fillStyle = colorOf(tk);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(R * 1.05)}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(tk.num), p.x, p.y + 1);
}

function drawBall(tk) {
  const z = tk.z || 0;
  const q = toPx(tk);
  ctx.beginPath();
  ctx.ellipse(q.x, q.y, R * 0.6 * (1 - Math.min(z, .8) * .4), R * 0.25, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(0,0,0,${z > 0 ? .25 : .35})`;
  ctx.fill();
  const p = displayPx(tk);
  ctx.beginPath();
  ctx.arc(p.x, p.y, R * 0.6, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#111827';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x, p.y, R * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = '#111827';
  ctx.fill();
}

function drawShape(h) {
  ctx.save();
  ctx.strokeStyle = ctx.fillStyle = '#facc15';
  ctx.lineWidth = 3;
  if (h.type === 'area') {
    ctx.beginPath();
    h.pts.forEach((q, i) => { const c = toPx(q); i ? ctx.lineTo(c.x, c.y) : ctx.moveTo(c.x, c.y); });
    ctx.closePath();
    ctx.globalAlpha = .25;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
  } else {
    const a = toPx(h.a), b = toPx(h.b);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (h.type === 'arrow') {
      const ang = Math.atan2(b.y - a.y, b.x - a.x), L = 14;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - L * Math.cos(ang - .45), b.y - L * Math.sin(ang - .45));
      ctx.lineTo(b.x - L * Math.cos(ang + .45), b.y - L * Math.sin(ang + .45));
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function drawPoly() {
  ctx.save();
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  poly.forEach((q, i) => { const c = toPx(q); i ? ctx.lineTo(c.x, c.y) : ctx.moveTo(c.x, c.y); });
  if (mpos) ctx.lineTo(mpos.x, mpos.y);
  ctx.stroke();
  ctx.restore();
  ring(toPx(poly[0]), 7, '#facc15', 2);
}

function draw() {
  const P = interp(state.t);
  ctx.clearRect(0, 0, W, H);
  drawField();
  shapes.forEach(drawShape);
  if (drawing) drawShape(drawing);
  if (poly) drawPoly();

  if (kfs.length > 1) {
    tokens.forEach(tk => {
      ctx.beginPath();
      kfs.forEach((k, j) => {
        const q = toPx(k.p[tk.id]);
        j ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
      });
      ctx.strokeStyle = tk.type === 'b' ? 'rgba(255,255,255,.5)' : colorOf(tk) + '99';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    });
  }

  events.forEach(e => {
    if (FLIGHT.has(e.type) && (e === selEvent || active(e, state.t))) drawTrajectory(e);
  });
  drawEffects(P);

  if (selEvent) {
    ring(displayPx(tokens[selEvent.actor]), R * 1.5, '#fbbf24', 2, true);
    if (selEvent.target != null && selEvent.target !== 'goal') {
      ring(typeof selEvent.target === 'object' ? toPx(selEvent.target) : displayPx(tokens[selEvent.target]), R * 1.5, '#fbbf24', 2, true);
    }
  }

  if (pendingActor !== null) {
    const a = displayPx(tokens[pendingActor]);
    ring(a, R * 1.6, '#22d3ee', 3);
    if (mpos) {
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mpos.x, mpos.y);
      ctx.strokeStyle = 'rgba(34,211,238,.8)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  tokens.forEach(tk => tk.type === 'b' ? drawBall(tk) : drawPlayer(tk));

  let row = 0;
  events.forEach(e => { if (active(e, state.t)) drawBanner(e, row++); });
}

function updateTL() {
  const L = timelineLen();
  $('ph').style.left = (state.t / L * 100) + '%';
  $('time').textContent = `${state.t.toFixed(2)} / ${dur().toFixed(2)} s`;
  $('kdel').disabled = !kfs.some(k => Math.abs(k.t - state.t) < 1e-6 && k.t > 0);
}

function loop() {
  const n = performance.now();
  const dt = (n - state.last) / 1000;
  state.last = n;
  if (state.playing) {
    const d = dur();
    const t = Math.min(d, state.t + dt * state.speed);
    applyTime(t);
    if (t >= d) pause();
  }
  if (timelineLen() !== lastL) renderTimeline();
  draw();
  updateTL();
  requestAnimationFrame(loop);
}

function normPx(pt) {
  return {x: clamp((pt.x - PAD) / (W - 2 * PAD), 0, 1), y: clamp((pt.y - PAD) / (H - 2 * PAD), 0, 1)};
}

function localPx(e) {
  const r = cvs.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}

function hit(pt) {
  for (let i = tokens.length - 1; i >= 0; i--) {
    const p = displayPx(tokens[i]);
    if (Math.hypot(pt.x - p.x, pt.y - p.y) < R * 1.2) return tokens[i];
  }
  return null;
}

cvs.addEventListener('pointerdown', e => {
  pause();
  const pt = localPx(e), tk = hit(pt);

  if (tool === 'area') {
    const n = normPx(pt), px = q => Math.hypot((q.x - n.x) * W, (q.y - n.y) * H);
    if (!poly) { poly = [n]; return; }
    if (poly.length >= 3 && px(poly[0]) < 12 || px(poly[poly.length - 1]) < 6) {
      if (poly.length >= 3) { shapes.push({type: 'area', pts: poly}); scheduleSave(); poly = null; }
      return;
    }
    poly.push(n);
    return;
  }

  if (SHAPES.has(tool)) {
    cvs.setPointerCapture(e.pointerId);
    const n = normPx(pt);
    drawing = {type: tool, a: n, b: n, pid: e.pointerId};
    return;
  }

  if (tool === 'move') {
    if (!tk) { selEvent = null; renderTimeline(); updateEventPanel(); return; }
    if (tk.type === 'b' && ballInActive()) { setStatus('st_locked'); return; }
    cvs.setPointerCapture(e.pointerId);
    drag = {id: tk.id, pid: e.pointerId, kf: null};
    return;
  }

  if (FLIGHT.has(tool) && pendingActor !== null && (!tk || tk.type !== 'p')) {
    createEvent(tool, pendingActor, normPx(pt));
    return;
  }
  if (!tk || tk.type !== 'p') {
    pendingActor = null;
    setStatus('st_needPlayer');
    return;
  }
  if (tool === 'dribble' || tool === 'block') {
    createEvent(tool, tk.id, null);
    return;
  }
  if (pendingActor === null) {
    pendingActor = tk.id;
    setStatus('st_pickTarget');
    return;
  }
  if (tk.id === pendingActor && tool === 'shot') {
    createEvent('shot', pendingActor, 'goal');
    return;
  }
  if (tk.id === pendingActor) {
    pendingActor = null;
    setStatus('st_' + tool);
    return;
  }
  createEvent(tool, pendingActor, tk.id);
});

cvs.addEventListener('pointermove', e => {
  mpos = localPx(e);
  if (drawing && e.pointerId === drawing.pid) { drawing.b = normPx(mpos); return; }
  if (!drag || e.pointerId !== drag.pid) return;
  const pt = localPx(e);
  const x = clamp((pt.x - PAD) / (W - 2 * PAD), 0, 1);
  const y = clamp((pt.y - PAD) / (H - 2 * PAD), 0, 1);
  if (!drag.kf) drag.kf = ensureKey(state.t);
  drag.kf.p[drag.id] = {x, y};
  events.forEach(syncEvent);
  applyTime(state.t);
});

cvs.addEventListener('pointerleave', () => { mpos = null; });

function endDrag(e) {
  if (drawing && e.pointerId === drawing.pid) {
    const {a, b} = drawing, type = drawing.type;
    drawing = null;
    if (Math.hypot((b.x - a.x) * W, (b.y - a.y) * H) > 6) {
      shapes.push({type, a, b});
      scheduleSave();
    }
    return;
  }
  if (drag && e.pointerId === drag.pid) { drag = null; scheduleSave(); }
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);

const track = $('track');
track.addEventListener('pointerdown', e => {
  pause();
  scrubbing = true;
  track.setPointerCapture(e.pointerId);
  scrubTo(e);
});
track.addEventListener('pointermove', e => { if (scrubbing) scrubTo(e); });
track.addEventListener('pointerup', () => { scrubbing = false; });
track.addEventListener('pointercancel', () => { scrubbing = false; });

$('play').addEventListener('click', () => state.playing ? pause() : play());
$('restart').addEventListener('click', () => { seek(0); play(); });
$('speed').addEventListener('change', e => state.speed = +e.target.value);
$('kdel').addEventListener('click', deleteKeyHere);
$('pdel').addEventListener('click', deleteEvent);
$('pdur').addEventListener('input', e => setParam('dur', Math.max(0.2, +e.target.value)));
$('pbend').addEventListener('input', e => setParam('bend', +e.target.value));
$('plift').addEventListener('input', e => setParam('lift', +e.target.value));
const okToLose = () => (!events.length && !shapes.length && kfs.length <= 1) || confirm(T('confirmLose'));
$('clearDraw').addEventListener('click', () => { if (!shapes.length) return; shapes = []; draw(); scheduleSave(); });
$('reset').addEventListener('click', () => { if (!okToLose()) return; build(); scheduleSave(); });
$('export').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(serialize())], {type: 'application/json'}));
  a.download = 'scenario.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
$('import').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try { restore(JSON.parse(await f.text())); setStatus('st_imported'); scheduleSave(); }
  catch { setStatus('st_importFail'); }
});
$('mode').addEventListener('change', e => {
  if (!okToLose()) { e.target.value = mode; return; }
  mode = e.target.value;
  resize();
  build();
  scheduleSave();
});
$('colA').addEventListener('input', () => { draw(); scheduleSave(); });
$('colB').addEventListener('input', () => { draw(); scheduleSave(); });

document.querySelectorAll('.tool').forEach(b => {
  b.addEventListener('click', () => setTool(b.dataset.tool));
});

document.querySelectorAll('.lang button').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.dataset.lang;
    applyI18n();
    draw();
  });
});

window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'range') return;
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const z = e.key.toLowerCase();
    if (z === 'z' || z === 'y') {
      e.preventDefault();
      (z === 'y' || e.shiftKey ? redo : undo)();
      return;
    }
  }
  if (e.code === 'Space') {
    e.preventDefault();
    state.playing ? pause() : play();
    return;
  }
  if (e.key === 'Escape') {
    pendingActor = null;
    selEvent = null;
    setTool('move');
    renderTimeline();
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selEvent) { e.preventDefault(); deleteEvent(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (KEYS[k] && !e.ctrlKey && !e.metaKey && !e.altKey) setTool(KEYS[k]);
});

state.speed = +$('speed').value;
applyI18n();
build();
setTool('move');
try { restore(JSON.parse(localStorage.getItem(KEY))); } catch {}
resize();
pushHistory();
$('undo').addEventListener('click', undo);
$('redo').addEventListener('click', redo);
requestAnimationFrame(loop);
</script>
</body>
</html>
