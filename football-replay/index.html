<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Scenario Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#1a1a1a;color:#e2e8f0}
button,select,input[type=checkbox],a.back,summary{min-height:44px}
button,a.back,summary{min-width:44px;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:13px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:4px 10px;cursor:pointer;text-decoration:none;list-style:none}
summary::-webkit-details-marker{display:none}
button:hover,summary:hover{border-color:#64748b}
button.tool.on,button[aria-pressed=true]{background:#2563eb;border-color:#2563eb}
select{font:inherit;font-size:13px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:4px 8px}
label{font-size:13px;display:flex;align-items:center;gap:4px;min-height:44px}
input[type=checkbox]{min-width:24px}
:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.wrap{height:100dvh;display:grid;gap:1px;background:#000;grid-template-columns:var(--tools-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "tools view" "time time"}
header{grid-area:head;display:flex;align-items:center;gap:6px;padding:2px 8px;background:#232323;min-width:0}
h1{font-size:14px;margin:0 6px 0 0;white-space:nowrap}
.tb-phases{display:flex;gap:2px;order:1}
.tb-phases .tb-group{display:none}
.tb-menu-wrap{order:2}
.tb-menu{position:fixed;top:52px;left:8px;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:min(560px,calc(100vw - 16px));padding:8px;background:#232323;border:1px solid #000;box-shadow:0 8px 24px #000a}
#btn-props{order:3}
a.back{order:9;margin-left:auto}
.tb-group{font-size:11px;color:#94a3b8;margin:6px 0 2px}
#toolbar{display:contents}
.tb-tools{grid-area:tools;display:flex;flex-direction:column;gap:4px;padding:6px;background:#232323;overflow:auto}
.tb-wrap{display:contents}.tb-wrap[hidden]{display:none}
.tb-tools button{width:100%}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
:root{--tools-w:60px}.lbl{display:none}.ic{flex:none}
@media (pointer:coarse){:root{--tools-w:112px}.lbl{display:inline;margin-left:6px}}
#viewer{display:block;grid-area:view;overflow:auto;padding:4px;background:#181818;min-width:0}
#viewer canvas{display:block;margin-top:4px;touch-action:none;border-radius:6px;width:min(100%,calc((100dvh - 175px) * 1.4))}
#status{padding:2px 8px;border-radius:6px;background:#1e3a8a;font-size:12px;min-height:26px;display:flex;align-items:center}
#timeline{grid-area:time;background:#232323;padding:4px 8px}
#timeline .tl-panel{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 8px;align-items:center}
#timeline .tl-panel>:nth-child(1){overflow-x:auto;flex-wrap:nowrap;max-width:60vw}
#timeline .tl-panel>:nth-child(1){scrollbar-width:none}
#timeline .tl-panel>:nth-child(1)>*{flex:none}
#timeline .tl-panel>:nth-child(2){grid-column:1/-1}
#props{position:fixed;top:52px;right:0;bottom:0;z-index:10;width:min(340px,75vw);padding:8px;background:#232323;overflow:auto;font-size:13px;box-shadow:-8px 0 24px #000a;transform:translateX(100%);visibility:hidden}
body.props-open #props{transform:none;visibility:visible}
#props>div:not(:empty){padding:6px 2px;border-bottom:1px solid #000}
#rotate{display:none}
#btn-tl{display:none}
@media (orientation:landscape) and (min-aspect-ratio:8/5){
.wrap{grid-template-columns:var(--tools-w) minmax(0,1fr) clamp(240px,30vw,340px);grid-template-areas:"head head head" "tools view props" "time time time"}
#props{position:static;grid-area:props;width:auto;transform:none;visibility:visible;box-shadow:none}
#btn-props{display:none}
}
@media (orientation:landscape) and (max-height:480px){
.wrap{grid-template-columns:var(--tools-w) minmax(0,1fr);grid-template-areas:"head head" "tools view" "time time"}
#props{position:fixed;grid-area:auto;width:min(340px,75vw);transform:translateX(100%);visibility:hidden;box-shadow:-8px 0 24px #000a}
body.props-open #props{transform:none;visibility:visible}
#btn-props{display:inline-flex}
button,select,input[type=checkbox],a.back,summary,label{min-height:32px}
header{padding:0 8px}
#props,.tb-menu{top:34px}
#timeline{padding:2px 8px}
#timeline .tl-panel button,#timeline .tl-panel select{min-height:32px}
#timeline .tl-panel{gap:2px 8px}
#viewer{padding:2px}
#viewer canvas{margin-top:2px;width:min(100%,calc((100dvh - 40px) * 1.5))}
/* timeline overlays the pitch bottom, status floats as a toast: pitch gets the full height (#44) */
#timeline{grid-area:view;align-self:end;z-index:5;background:#232323d9;max-height:50dvh;overflow:auto}
#timeline .tl-track{display:none}
body.tl-open #timeline .tl-track{display:block}
#status{position:fixed;top:36px;left:116px;z-index:4;max-width:50vw;min-height:0;font-size:11px;background:#1e3a8ae6;pointer-events:none}
#status:empty{display:none}
#btn-tl{display:inline-flex;order:3}
}
@media (pointer:fine){
button,select,input[type=checkbox],a.back,summary,label{min-height:30px}
#timeline .tl-panel button,#timeline .tl-panel select{min-height:30px;min-width:30px}
#props .ee-panel :is(button,select,input),#props .ap-panel :is(button,input){min-height:30px;min-width:30px}
#props,.tb-menu{top:40px}
}
@media (pointer:fine) and (min-height:481px){
#viewer canvas{width:min(100%,calc((100dvh - 185px) * 1.4))}
}
/* portrait phones: pitch first, tools as a bottom bar, timeline last (#14) */
@media (orientation:portrait) and (max-width:700px){
.wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "view" "tools" "time"}
header{flex-wrap:wrap}
#viewer canvas{width:100%}
.tb-tools{flex-direction:row;overflow-x:auto;overflow-y:hidden}
.tb-wrap{display:flex;gap:4px;flex:none;align-items:center}.tb-wrap[hidden]{display:none}
.tb-tools button{width:auto;flex:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Football Simulator</h1>
    <button id="btn-props" type="button" aria-controls="props" aria-expanded="false">Panels</button>
    <a class="back" href="../">← Home</a>
  </header>
  <div id="toolbar" role="toolbar" aria-label="Tools"></div>
  <main id="viewer">
    <div id="status" role="status" aria-live="polite"></div>
    <canvas id="pitch" role="img" aria-label="Football pitch with players and ball. Use the status line and panels for the current state."></canvas>
  </main>
  <div id="timeline"></div>
  <aside id="props" aria-label="Properties">
    <div id="flow"></div>
    <div id="setup"></div>
    <div id="editor"></div>
    <div id="annotations"></div>
    <div id="analysis"></div>
  </aside>
</div>
<div id="rotate" role="alert">Rotate your phone to landscape to use the simulator.</div>
<script type="module" src="./ui/app.js"></script>
<script type="module" src="./ui/layout.js"></script>
</body>
</html>
