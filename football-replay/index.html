<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Scenario Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#0b1120;color:#e2e8f0}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:2px 0}
a.back{color:#e2e8f0;text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid #334155;border-radius:8px;background:#1e293b}
.tb-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.tb-group{font-size:12px;color:#94a3b8;margin-left:6px}
.format{font-weight:600;padding:6px 10px;background:#1e3a8a;border-radius:8px}
select{font:inherit;font-size:14px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:8px}
label{font-size:13px;display:flex;align-items:center;gap:4px}
button.tool.on{background:#2563eb;border-color:#2563eb}
#status{padding:10px 14px;border-radius:8px;background:#1e3a8a;font-size:14px;min-height:42px;display:flex;align-items:center;margin-top:8px}
#timeline{margin-top:8px}
#flow,#editor,#annotations{margin-top:8px;font-size:13px}
button{font:inherit;font-size:14px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:#64748b}
canvas{width:100%;display:block;border-radius:10px;margin-top:8px;touch-action:none}
button,select,a.back,input[type=checkbox]{min-height:44px}
button,a.back{min-width:44px;display:inline-flex;align-items:center;justify-content:center}
input[type=checkbox]{min-width:24px}
label{min-height:44px}
:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
@media (max-width:600px){
.wrap{display:flex;flex-direction:column;padding:8px}
header{order:0}h1{font-size:16px}
#status{order:1;margin-top:4px;min-height:44px;font-size:13px}
#pitch{order:2}
#toolbar{order:3}
#timeline,#flow,#editor,#annotations,#analysis{order:4}
.tb-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.tb-row>*{flex:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Football Scenario Simulator</h1>
    <a class="back" href="../">← Home</a>
  </header>
  <div id="toolbar" role="toolbar" aria-label="Tools"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <canvas id="pitch" role="img" aria-label="Football pitch with players and ball. Use the status line and panels for the current state."></canvas>
  <div id="timeline"></div>
  <div id="flow"></div>
  <div id="editor"></div>
  <div id="annotations"></div>
  <div id="analysis"></div>
</div>
<script type="module" src="./ui/app.js"></script>
</body>
</html>
