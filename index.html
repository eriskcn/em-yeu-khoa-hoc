<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinh Thanh Hoai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    // localStorage may throw (private mode); fall back to OS preference / English
    const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
    const dark = get('theme') ? get('theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-100">
  <div class="fixed top-4 right-4 flex gap-2 text-sm">
    <button id="lang" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-white dark:border-slate-600 dark:hover:bg-slate-800" aria-label="Switch language"></button>
    <button id="theme" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-white dark:border-slate-600 dark:hover:bg-slate-800" aria-label="Toggle dark mode">
      <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <main class="min-h-screen max-w-xl mx-auto px-4 flex flex-col justify-center">
    <img src="./avatar.png" alt="Dinh Thanh Hoai" class="h-32 w-32 rounded-full bg-white object-cover ring-4 ring-indigo-500/30">
    <h1 class="mt-6 whitespace-pre-line text-4xl font-bold tracking-tight" data-en="Hi guys,&#10;I'm Dinh Thanh Hoai" data-vi="Xin chào, xin chào!&#10;Mình là Đinh Thanh Hoài"></h1>
    <blockquote class="mt-6 border-l-4 border-indigo-500 pl-4 text-lg italic text-slate-600 dark:text-slate-300"
      data-en="&quot;If compound interest is the eighth wonder of the world, then Dependency Injection must be the ninth.&quot;"
      data-vi="&quot;Nếu lãi kép là kỳ quan thứ tám của thế giới, thì Dependency Injection hẳn là kỳ quan thứ chín.&quot;"></blockquote>
    <div class="mt-8 flex flex-col gap-2 text-slate-600 dark:text-slate-300">
      <a class="inline-flex items-center gap-2 text-indigo-600 hover:underline dark:text-indigo-400" href="mailto:hoaikcn7@gmail.com" aria-label="Email">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        hoaikcn7@gmail.com
      </a>
      <a class="inline-flex items-center gap-2 text-indigo-600 hover:underline dark:text-indigo-400" href="https://github.com/eriskcn" aria-label="GitHub">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a10.9 10.9 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
        eriskcn
      </a>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById('theme');
    const langBtn = document.getElementById('lang');

    themeBtn.onclick = () => set('theme', root.classList.toggle('dark') ? 'dark' : 'light');

    let lang = get('lang') === 'vi' ? 'vi' : 'en';
    function renderLang() {
      root.lang = lang;
      document.querySelectorAll('[data-en]').forEach((el) => (el.textContent = el.dataset[lang]));
      langBtn.textContent = lang === 'en' ? 'VI' : 'EN'; // shows the language you switch to
    }
    langBtn.onclick = () => { lang = lang === 'en' ? 'vi' : 'en'; set('lang', lang); renderLang(); };

    renderLang();
  </script>
</body>
</html>
